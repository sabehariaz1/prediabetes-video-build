name: Build explainer video

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.mp4"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Files in repo:"
          find . -path ./.git -prune -o -type f -print | head -50

      - name: Find build_video.py
        run: |
          SCRIPT=$(find . -name build_video.py -not -path "./.git/*" | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::build_video.py was not found in the repository. Upload it to the repo (Add file > Upload files)."
            exit 1
          fi
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "Found: $SCRIPT"

      - name: Install system packages
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core
          fc-cache -f
          ffmpeg -version | head -1

      - name: Install Python packages
        run: |
          python3 -m pip install --break-system-packages --upgrade pillow numpy edge-tts
          python3 -m pip install --break-system-packages gTTS || true

      - name: Build video
        env:
          OUT_FILE: ${{ github.workspace }}/prediabetes-explainer.mp4
        run: python3 "$SCRIPT"

      - name: Check video
        run: |
          ls -lh prediabetes-explainer.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 prediabetes-explainer.mp4

      - name: Upload as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediabetes-explainer
          path: prediabetes-explainer.mp4

      - name: Commit video to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediabetes-explainer.mp4
          git diff --cached --quiet || git commit -m "Update explainer video"
          git push || (git pull --rebase && git push)
